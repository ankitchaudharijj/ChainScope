services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: chainscope
      POSTGRES_PASSWORD: chainscope
      POSTGRES_DB: chainscope
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chainscope"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/chainscope123
      NEO4J_PLUGINS: '[]'
    volumes:
      - neo4jdata:/data
    ports:
      - "7475:7474"   # Neo4j Browser — http://localhost:7474
      - "7688:7687"   # Bolt protocol — what the API connects to
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    ports:
      - "8001:8000"

volumes:
  pgdata:
  neo4jdata:
